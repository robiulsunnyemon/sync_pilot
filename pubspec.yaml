name: sync_pilot
description: >-
  Database-agnostic, offline-first sync engine for Dart and Flutter with
  outbox compaction, 3-way conflict resolution, and delta sync.
version: 0.1.1
homepage: https://github.com/robiulsunnyemon/sync_pilot
repository: https://github.com/robiulsunnyemon/sync_pilot
issue_tracker: https://github.com/robiulsunnyemon/sync_pilot/issues
topics:
  - sync
  - offline-first
  - local-first
  - database
  - cache

environment:
  sdk: ^3.0.0

# Zero external runtime dependencies for maximum compatibility across
# Android, iOS, Web (WASM), Windows, macOS, Linux, and Dart Backend/CLI.
dependencies: {}

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.24.0
